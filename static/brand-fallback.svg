<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ecfaf1"/>
            <stop offset="100%" stop-color="#d8f3e2"/>
        </linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22c55e"/>
            <stop offset="100%" stop-color="#15803d"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16a34a" flood-opacity="0.25"/>
        </filter>
    </defs>
    <rect width="600" height="600" fill="url(#bg)"/>
    <g transform="translate(300 250)" filter="url(#shadow)">
        <circle r="120" fill="url(#leaf)"/>
        <g transform="translate(-46 -46) scale(3.8)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C7 7 5 11 5 15a7 7 0 0 0 14 0c0-4-2-8-7-13Z"/>
            <path d="M12 22V11"/>
        </g>
    </g>
    <text x="300" y="450" text-anchor="middle"
          font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif"
          font-size="48" font-weight="800" fill="#15803d" letter-spacing="-1">
        EcoWise
    </text>
    <text x="300" y="490" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif"
          font-size="20" fill="#5b7a6c">
        Smarter shopping. Greener planet.
    </text>
</svg>
